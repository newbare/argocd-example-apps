apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-declarativo
  namespace: argocd
spec:
  replicas: 3
  project: guestbook-declarativo
  source:
    repoURL: https://github.com/newbare/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
